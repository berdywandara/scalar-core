[package]
name = "scalar-stark-p3-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A-R7: Independent second verifier implementation. Spec §15.3.
# Re-implements Transfer and Mint AIR constraints independently from
# scalar-stark-p3. Proofs generated by scalar-stark-p3 must verify here.
# "Two independent implementations must produce mutually verifiable proofs."

[dependencies]
# Import proof types and public claims from primary prover — NOT the AIR impl.
scalar-stark-p3 = { path = "../scalar-stark-p3" }
thiserror.workspace = true
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

# Plonky3 — same version, independent AIR definitions
p3-air           = "0.6"
p3-field         = "0.6"
p3-goldilocks    = "0.6"
p3-matrix        = "0.6"
p3-uni-stark     = "0.6"
