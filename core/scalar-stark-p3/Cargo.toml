[package]
name = "scalar-stark-p3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Plonky3 migration — replaces scalar-stark (Winterfell) before testnet.
# Spec §2.1: Plonky3 is the target prover for pre-mainnet.
# Sub-phases: P3-R1 (setup) → P3-R2 (config) → P3-R3 (Poseidon2Air)
#           → P3-R4 (TransferAir) → P3-R5 (MintAir) → P3-R6 (ZK blinding)
#           → P3-R7 (remove Winterfell) → P3-R8 (STARKPack) → P3-R9 (bench)

[dependencies]
scalar-crypto    = { path = "../scalar-crypto" }
scalar-emission  = { path = "../scalar-emission" }
scalar-nullifier = { path = "../scalar-nullifier" }
thiserror.workspace = true
blake3.workspace  = true

# Plonky3 0.5.3 — stable release with p3-poseidon2-air
p3-air           = "0.5"
p3-challenger    = "0.5"
p3-commit        = "0.5"
p3-dft           = "0.5"
p3-field         = "0.5"
p3-fri           = "0.5"
p3-goldilocks    = "0.5"
p3-matrix        = "0.5"
p3-merkle-tree   = "0.5"
p3-poseidon2     = "0.5"
p3-poseidon2-air = "0.5"
p3-symmetric     = "0.5"
p3-uni-stark     = "0.5"
p3-keccak        = "0.5"
rand             = "0.9"
postcard         = { version = "1", features = ["alloc"] }

[features]
# Run hardware benchmark tests. Spec §15.6.
bench-hardware = []
