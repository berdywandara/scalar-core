[package]
name = "scalar-network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Dependencies ke internal crates kita
scalar-crypto = { path = "../scalar-crypto" }
scalar-nullifier = { path = "../scalar-nullifier" }
scalar-emission = { path = "../scalar-emission" }
libp2p = { workspace = true, features = ["gossipsub", "kad", "macros", "noise", "tcp", "tokio", "yamux"] }
tokio = { workspace = true, features = ["full"] }
thiserror.workspace = true
rand = "0.9.4"
rand_chacha = "0.9.0"
bincode = "1.3.3"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
tokio-socks = "0.5.2"
serde_json = "1.0.149"
blake3 = "1.5"

[features]
# Dev-only: faster sub-epoch timing for local Codespace benchmarks.
# DEFAULT OFF. MUST NOT be enabled in release builds.
# Source: BENCHMARK_RESULTS.md (Codespace artefact, not a protocol parameter).
# Ref: SCALAR-PROTOCOL §4.2 T-6, §13.1.
dev-fast-subepoch = []
