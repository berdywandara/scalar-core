[package]
name = "scalar-ffi"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib = untuk Android (.so) / Linux / Windows (.dll)
# staticlib = untuk iOS (.a)
# rlib = untuk test dan integrasi Rust internal
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
scalar-wallet-core = { path = "../scalar-wallet-core" }
blake3 = "1.8.4"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
