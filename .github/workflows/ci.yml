# scalar-core CI — SCALAR-REPO §8
# Wajib hijau sebelum setiap merge ke main atau dev.

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Gate 1: Format & Lint ────────────────────────────────────
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  # ─── Gate 2: Build ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo build
        run: cargo build --all-features --workspace

  # ─── Gate 3: Test ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo test
        # scalar-stark-p3 (STARK prover) dikecualikan — terlalu berat untuk CI runner.
        # Jalankan manual di VPS: cargo test --all-features --workspace
        run: cargo test --all-features --workspace --exclude scalar-stark-p3

  # ─── Gate 4: OSSIFIED Invariants ──────────────────────────────
  ci-gates:
    name: CI Gates (OSSIFIED)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Gate — Poseidon2 test vectors (scalar-crypto)
        # OSSIFIED: Poseidon2 permutation known vector — SCALAR-SECURITY §5.3
        run: cargo test -p scalar-crypto poseidon2 -- --nocapture
      - name: Gate — Conviction table monotonicity (scalar-governance)
        # OSSIFIED: Conviction factor monotonic increasing — SCALAR-PROTOCOL §11.2
        run: cargo test -p scalar-governance conviction -- --nocapture
      - name: Gate — OSSIFIED proof parameters match spec (scalar-stark-p3)
        # OSSIFIED: field=cubic GF(p^3), queries=108, grinding=0.
        # Source: SCALAR-SECURITY §[PROOF-PARAMS]. Blocks merge if any value deviates.
        # This gate is lightweight (compile-time assertions + size_of check, no proving).
        run: cargo test -p scalar-stark-p3 proof_params_match_spec -- --nocapture
      - name: Gate — Domain separator uniqueness (scalar-crypto)
        # OSSIFIED: all domain separators must be unique. SCALAR-PROTOCOL §13.1.
        run: cargo test -p scalar-crypto test_all_domains_unique -- --nocapture
      - name: Gate — Poseidon2 KAT vector bit-exact (scalar-stark-p3)
        # OSSIFIED: Poseidon2 Goldilocks t=8 KAT vector. SCALAR-TECHNICAL §1.1.
        # Blocks merge if p3-goldilocks upgrade changes hash semantics.
        run: cargo test -p scalar-stark-p3 test_poseidon2_kat_vector_scalar_technical_s1_1 -- --nocapture
