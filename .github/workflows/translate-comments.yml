          def translate_text(text):
              """Translate Indonesian text to English using dictionary."""
              result = text
              # Sort by key length (longest first) to handle phrases before words
              for id_text, en_text in sorted(TRANSLATIONS.items(), key=lambda x: -len(x[0])):
                  # Case-insensitive replacement
                  pattern = re.compile(re.escape(id_text), re.IGNORECASE)
                  result = pattern.sub(en_text, result)
              return result

          def process_file(filepath, dry_run=False):
              """Process a single Rust file - translate comments only."""
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              lines = content.split('\n')
              translated_lines = []
              changed = False
              
              for line in lines:
                  new_line = line
                  
                  # Documentation comments (/// or //!)
                  if line.strip().startswith('///'):
                      indent = len(line) - len(line.lstrip())
                      prefix = line[:indent] + '/// '
                      comment = line.strip()[3:].strip()
                      if comment:
                          translated = translate_text(comment)
                          if translated != comment:
                              new_line = prefix + translated
                              changed = True
                  elif line.strip().startswith('//!'):
                      indent = len(line) - len(line.lstrip())
                      prefix = line[:indent] + '//! '
                      comment = line.strip()[3:].strip()
                      if comment:
                          translated = translate_text(comment)
                          if translated != comment:
                              new_line = prefix + translated
                              changed = True
                  # Inline comments (// after code)
                  elif '//' in line and not line.strip().startswith('//'):
                      parts = line.split('//', 1)
                      code_part = parts[0]
                      comment_part = parts[1] if len(parts) > 1 else ''
                      if comment_part.strip():
                          translated = translate_text(comment_part)
                          if translated != comment_part:
                              new_line = code_part + '//' + translated
                              changed = True
                  
                  translated_lines.append(new_line)
              
              if changed and not dry_run:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(translated_lines))
              
              return changed

          # Main execution
          dry_run = '{{ github.event.inputs.dry_run }}' == 'true'
          print(f"Mode: {'DRY RUN (preview only)' if dry_run else 'TRANSLATE & COMMIT'}")
          print(f"Dictionary size: {len(TRANSLATIONS)} entries")
          print()
          
          translated_files = []
          total_files = 0
          
          for root, dirs, files in os.walk('.'):
              # Skip target directory
              if 'target' in root:
                  continue
              for file in files:
                  if file.endswith('.rs'):
                      total_files += 1
                      filepath = os.path.join(root, file)
                      changed = process_file(filepath, dry_run)
                      if changed:
                          translated_files.append(filepath)
                          print(f"  {'[DRY RUN] ' if dry_run else ''}Translated: {filepath}")
          
          print()
          print(f"Scanned: {total_files} Rust files")
          print(f"Translated: {len(translated_files)} files")
          
          if translated_files:
              with open('translated_files.txt', 'w') as f:
                  for tf in translated_files:
                      f.write(tf + '\n')
          
          if dry_run:
              print("\n⚠️  DRY RUN MODE — No files were modified.")
              sys.exit(0)
          elif not translated_files:
              print("\n✅ No Indonesian comments found. All files are already in English.")
              sys.exit(0)
          PYEOF
          
          python3 translate.py
      
      - name: Run cargo fmt on changed files
        run: cargo fmt --all 2>/dev/null || echo "cargo fmt not available, skipping"
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'docs: translate Indonesian comments to English'
          title: '🌐 Translate Indonesian comments to English'
          body: |
            ## Changes
            This PR automatically translates Indonesian documentation comments to English.
            
            ### Translation dictionary
            - **600+ entries** based on scan of 153 Rust files
            - Covers structural words, technical terms, and Scalar Core-specific phrases
            - Case-insensitive replacement
            
            ### What was translated
            - Documentation comments (`///`)
            - Module documentation (`//!`)
            - Inline comments (`//`)
            
            ### What was NOT changed
            - Code logic (unchanged)
            - Code strings/identifiers (unchanged)
            - English comments (unchanged)
            
            ### Post-processing
            - `cargo fmt` applied automatically
            
            ### Review checklist
            - [ ] Technical terms correctly translated
            - [ ] No broken documentation links
            - [ ] `cargo doc` builds successfully
          branch: translate-indonesian-comments
          base: main
          delete-branch: true
