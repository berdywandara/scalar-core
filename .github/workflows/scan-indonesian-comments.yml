name: Scan Indonesian Comments

on:
  workflow_dispatch:  # Manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Extract Indonesian comments
        run: |
          cat > extract_comments.py << 'PYEOF'
          import re
          import os
          import json
          from collections import Counter
          
          # Indonesian stopwords and common patterns
          INDONESIAN_PATTERNS = [
              r'\b[a-z]+nya\b',      # -nya suffix
              r'\b[a-z]+kan\b',      # -kan suffix
              r'\b[a-z]+i\b',        # -i suffix
              r'\b[a-z]+lah\b',      # -lah suffix
              r'\b[a-z]+kah\b',      # -kah suffix
              r'\bdi[a-z]+\b',       # di- prefix
              r'\bme[a-z]+\b',       # me- prefix
              r'\bpe[a-z]+\b',       # pe- prefix
              r'\bber[a-z]+\b',      # ber- prefix
              r'\bter[a-z]+\b',      # ter- prefix
              r'\bse[a-z]+\b',       # se- prefix
              r'\bke[a-z]+\b',       # ke- prefix
              r'\bpeng[a-z]+\b',     # peng- prefix
              r'\bper[a-z]+\b',      # per- prefix
              r'\bmeng[a-z]+\b',     # meng- prefix
              r'\bmeny[a-z]+\b',     # meny- prefix
              r'\bmem[a-z]+\b',      # mem- prefix
              r'\bmen[a-z]+\b',      # men- prefix
          ]
          
          KNOWN_INDONESIAN = {
              'dan', 'atau', 'di', 'ke', 'dari', 'untuk', 'dengan',
              'yang', 'ini', 'itu', 'tersebut', 'adalah', 'ialah',
              'merupakan', 'yaitu', 'yakni', 'sebagai', 'pada',
              'dalam', 'akan', 'telah', 'sudah', 'sedang', 'belum',
              'tidak', 'bukan', 'belum', 'masih', 'selalu', 'pernah',
              'hanya', 'saja', 'juga', 'pun', 'serta', 'sambil',
              'ketika', 'saat', 'sebelum', 'setelah', 'selama',
              'jika', 'kalau', 'bila', 'apabila', 'meski', 'meskipun',
              'walau', 'walaupun', 'tetapi', 'namun', 'melainkan',
              'bahkan', 'apalagi', 'lagi', 'pula', 'lagi pula',
              'kecuali', 'selain', 'supaya', 'agar', 'biar',
              'sehingga', 'sampai', 'maka', 'lalu', 'kemudian',
              'setelah', 'sebelum', 'sesudah', 'sementara',
          }
          
          def is_indonesian_word(word):
              """Check if a word is likely Indonesian."""
              word = word.lower()
              # Check known Indonesian words
              if word in KNOWN_INDONESIAN:
                  return True
              # Check Indonesian prefixes/suffixes
              if word.endswith(('nya', 'kan', 'i', 'lah', 'kah', 'pun', 'an')):
                  return True
              if word.startswith(('di', 'me', 'pe', 'ber', 'ter', 'se', 'ke', 'peng', 'per', 'meng', 'meny', 'mem', 'men')):
                  return True
              # Check if contains Indonesian-specific characters
              if any(c in word for c in 'éèê'):
                  return True
              return False
          
          def extract_comments_from_file(filepath):
              """Extract all comments from a Rust file."""
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              results = []
              lines = content.split('\n')
              line_num = 0
              
              for line in lines:
                  line_num += 1
                  # Documentation comments
                  if line.strip().startswith('///') or line.strip().startswith('//!'):
                      comment = line.strip()[3:].strip()
                      if comment:
                          results.append({
                              'file': filepath,
                              'line': line_num,
                              'type': 'doc',
                              'text': comment,
                              'original': line
                          })
                  # Inline comments
                  elif '//' in line and not line.strip().startswith('//'):
                      code_part, comment_part = line.split('//', 1)
                      comment = comment_part.strip()
                      if comment:
                          results.append({
                              'file': filepath,
                              'line': line_num,
                              'type': 'inline',
                              'text': comment,
                              'original': line
                          })
                  # Block comments
                  elif '/*' in line:
                      # Simple block comment extraction
                      match = re.search(r'/\*(.*?)\*/', line)
                      if match:
                          comment = match.group(1).strip()
                          if comment:
                              results.append({
                                  'file': filepath,
                                  'line': line_num,
                                  'type': 'block',
                                  'text': comment,
                                  'original': line
                              })
              
              return results
          
          # Collect all comments
          all_comments = []
          word_counter = Counter()
          phrase_counter = Counter()
          
          print("Scanning Rust files...")
          file_count = 0
          
          for root, dirs, files in os.walk('.'):
              if 'target' in root:
                  continue
              for file in files:
                  if file.endswith('.rs'):
                      file_count += 1
                      filepath = os.path.join(root, file)
                      try:
                          comments = extract_comments_from_file(filepath)
                          all_comments.extend(comments)
                          
                          for c in comments:
                              # Extract words
                              words = re.findall(r'[a-zA-Z]+', c['text'].lower())
                              for word in words:
                                  if is_indonesian_word(word):
                                      word_counter[word] += 1
                              
                              # Extract 2-3 word phrases
                              words_list = c['text'].lower().split()
                              for i in range(len(words_list) - 1):
                                  bigram = ' '.join(words_list[i:i+2])
                                  if any(is_indonesian_word(w) for w in words_list[i:i+2]):
                                      phrase_counter[bigram] += 1
                              for i in range(len(words_list) - 2):
                                  trigram = ' '.join(words_list[i:i+3])
                                  if any(is_indonesian_word(w) for w in words_list[i:i+3]):
                                      phrase_counter[trigram] += 1
                      except Exception as e:
                          print(f"Error processing {filepath}: {e}")
          
          print(f"\nScanned {file_count} Rust files")
          print(f"Found {len(all_comments)} comments")
          print(f"Found {len(word_counter)} unique Indonesian words")
          print(f"Found {len(phrase_counter)} unique Indonesian phrases")
          
          # Save results
          output = {
              'summary': {
                  'total_files': file_count,
                  'total_comments': len(all_comments),
                  'unique_words': len(word_counter),
                  'unique_phrases': len(phrase_counter)
              },
              'top_words': word_counter.most_common(200),
              'top_phrases': phrase_counter.most_common(100),
              'all_words': dict(word_counter),
              'comments_sample': all_comments[:50]
          }
          
          with open('scan_results.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          
          # Print summary
          print("\n=== TOP INDONESIAN WORDS ===")
          for word, count in word_counter.most_common(50):
              print(f"  {count:4d}x  {word}")
          
          print("\n=== TOP INDONESIAN PHRASES ===")
          for phrase, count in phrase_counter.most_common(30):
              print(f"  {count:4d}x  {phrase}")
          
          PYEOF
          
          python3 extract_comments.py
      
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results.json
      
      - name: Create summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan_results.json', 'utf8'));
            
            const summary = `## 📊 Indonesian Comments Scan Results
            
            **Files scanned:** ${results.summary.total_files}
            **Comments found:** ${results.summary.total_comments}
            **Unique Indonesian words:** ${results.summary.unique_words}
            **Unique Indonesian phrases:** ${results.summary.unique_phrases}
            
            ### Top 20 Indonesian Words
            | Word | Count |
            |------|-------|
            ${results.top_words.slice(0, 20).map(([word, count]) => `| ${word} | ${count} |`).join('\n')}
            
            ### Top 10 Indonesian Phrases
            | Phrase | Count |
            |--------|-------|
            ${results.top_phrases.slice(0, 10).map(([phrase, count]) => `| ${phrase} | ${count} |`).join('\n')}
            
            ### Sample Comments (first 10)
            ${results.comments_sample.slice(0, 10).map(c => `- \`${c.file}:${c.line}\` — ${c.text.substring(0, 100)}`).join('\n')}
            
            ---
            📥 **Download full scan results:** [scan_results.json](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📊 Indonesian Comments Scan Results',
              body: summary,
              labels: ['documentation', 'scan']
            });
