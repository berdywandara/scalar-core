# Cargo.toml (workspace root)
[workspace]
members = [
    "core/*",
    "client/*",
    "tools/*",
]

resolver = "2"

[workspace.dependencies]
blake3 = "1.5"                    # BLAKE3

# ZK Proving
winterfell = "0.9"                # STARK prover/verifier

# Data structures

# Networking
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "macros", "tokio", "identify"] }
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Berdy Wandara"]
license = "MIT OR Apache-2.0"     
rust-version = "1.82.0"

[workspace.metadata]
# fuzz excluded — berdiri sendiri dengan nightly
