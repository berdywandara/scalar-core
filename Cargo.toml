# Cargo.toml (workspace root)
[workspace]
members = [
    "core/*",
    "core/scalar-stark-p3",
    "core/scalar-stark-p3-verify",
    "client/*",
    "tools/*",
    "tests/compliance",
    "tests/integration",
    "tests/spec-compliance",
    "tools/test-vector-gen",
]

resolver = "2"

[workspace.dependencies]
blake3 = "1.5"
hex = "0.4"                    # BLAKE3

# ZK Proving

# Data structures

# Networking
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "macros", "tokio", "identify"] }
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"
anyhow = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Berdy Wandara"]
license = "MIT OR Apache-2.0"     
rust-version = "1.82.0"

[workspace.metadata]
# fuzz excluded — berdiri sendiri dengan nightly
